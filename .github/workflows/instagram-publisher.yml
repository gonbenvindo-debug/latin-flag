name: Instagram publisher

on:
  push:
    paths:
      - "queue.json"
      - "scripts/**"
      - ".github/workflows/instagram-publisher.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run preparation, publication, or the complete flow"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - prepare
          - publish

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INSTAGRAM_USER_ID: "28527008726917037"
    steps:
      - name: Checkout queue
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install requests yt-dlp

      - name: Prepare and publish due items
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python scripts/instagram_github_flow.py --mode "$MODE"

      - name: Save queue state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || git commit -m "Update Instagram queue"
          git push

