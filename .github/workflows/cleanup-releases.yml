name: One-time cleanup
on:
  push:
    paths:
      - ".github/workflows/cleanup-releases.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Haki Vault releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/371457013"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/371454910"

      - name: Delete this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/cleanup-releases.yml" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/cleanup-releases.yml" \
            -f message="Remove one-time cleanup workflow" \
            -f sha="${FILE_SHA}"
